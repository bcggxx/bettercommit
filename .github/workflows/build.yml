name: Build VSIX

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub Release and attach the VSIX
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Bump patch version
        if: ${{ github.event.inputs.create_release == 'true' }}
        run: |
          old_version=$(node -p "require('./package.json').version")
          npm version patch --no-git-tag-version
          new_version=$(node -p "require('./package.json').version")
          echo "Bumped version: $old_version -> $new_version"

      - name: Install dependencies
        run: npm ci

      - name: Package VSIX
        run: npx @vscode/vsce@3.9.2 package

      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version (tag: v$version)"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: bettercommit-${{ steps.version.outputs.version }}-vsix
          path: |
            *.vsix
          if-no-files-found: error
          retention-days: 30

      - name: Commit version bump & push tag
        if: ${{ github.event.inputs.create_release == 'true' }}
        run: |
          git config user.name "bcggxx"
          git config user.email "191667089+bcggxx@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): bump version to ${{ steps.version.outputs.version }}"
          git tag ${{ steps.version.outputs.tag }}
          git push origin HEAD:${{ github.ref_name }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create GitHub Release
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            *.vsix

      # Publish to Open VSX (no Azure DevOps / credit card required).
      # Create the namespace once at https://open-vsx.org, then add the
      # access token as the OVSX_TOKEN repository secret. If the secret is
      # not configured this step is skipped, so the workflow stays safe.
      - name: Publish to Open VSX
        if: ${{ github.event.inputs.create_release == 'true' }}
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          if [ -z "$OVSX_TOKEN" ]; then
            echo "OVSX_TOKEN not set — skipping Open VSX publish"
            exit 0
          fi
          # create-namespace is idempotent: it errors if the namespace
          # already exists, so tolerate the failure on subsequent runs.
          npx ovsx create-namespace bcggxx -p "$OVSX_TOKEN" || true
          npx ovsx publish *.vsix -p "$OVSX_TOKEN"
